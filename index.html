<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d0e12" />
  <link rel="manifest" href="manifest.json" />
  <title>DOPA-01 Gadget</title>
  <style>
    :root {
      --bg: #0d0e12;
      --chassis: #1b1d24;
      --chassis-border: #2e323e;
      --screen-bg: #111318;
      --key-bg: #232630;
      --key-shadow: #0c0d11;
      --accent: #ff5a36;      /* 硬件橙红主色 */
      --accent-2: #7c5cff;
      --green: #10b981;
      --text: #f3f4f6;
      --muted: #8b92a5;
    }

    * {
      box-sizing: border-box;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    /* 实体掌上设备机身外壳 */
    .gadget-chassis {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, #22252e 0%, #171920 100%);
      border: 2px solid var(--chassis-border);
      border-radius: 28px;
      padding: 16px;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    /* 顶部硬件铭牌与指示灯 */
    .hardware-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 4px 12px 4px;
      border-bottom: 1px solid #2a2e39;
      margin-bottom: 14px;
    }

    .brand-tag {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #d1d5db;
    }

    .led-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      transition: all 0.2s ease;
    }
    .led-dot.busy {
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .hw-mini-btn {
      background: #272b36;
      color: #cbd5e1;
      border: 1px solid #383e4d;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 0 #0c0d11;
    }
    .hw-mini-btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    /* 内嵌 LCD/OLED 屏幕区 */
    .oled-screen {
      background: var(--screen-bg);
      border: 2px solid #090a0d;
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 16px;
      box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.85);
    }

    .screen-status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .screen-readout {
      font-size: 0.92rem;
      font-weight: 700;
      color: #e2e8f0;
      min-height: 22px;
      display: flex;
      align-items: center;
    }

    .step { display: none; }
    .step.active { display: block; }

    /* 6个机械按键风格正方形格子 (5分类 + 1 Roulette) */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .tactile-key {
      aspect-ratio: 1 / 1;
      background: linear-gradient(180deg, #282c37 0%, #1e212a 100%);
      border: 1px solid #363b49;
      border-radius: 16px;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 6px;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--key-shadow), 0 6px 12px rgba(0,0,0,0.35);
      transition: transform 0.06s ease, box-shadow 0.06s ease;
    }
    .tactile-key:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 var(--key-shadow);
    }

    .tactile-key.roulette-key {
      background: linear-gradient(180deg, #ff6847 0%, #d94323 100%);
      border-color: #ff866b;
      color: #fff;
      box-shadow: 0 4px 0 #7a200d, 0 6px 14px rgba(255, 90, 54, 0.3);
    }
    .tactile-key.roulette-key:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #7a200d;
    }

    .key-icon { font-size: 1.75rem; line-height: 1; }
    .key-label { font-size: 0.76rem; font-weight: 700; text-align: center; }
    .key-sub { font-size: 0.66rem; opacity: 0.75; }

    /* Step 2: 选项面板 */
    .panel-box {
      background: #14161c;
      border: 1px solid #282c37;
      border-radius: 16px;
      padding: 12px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }

    .ai-btn {
      background: linear-gradient(180deg, #8b6eff 0%, #6544e8 100%);
      border: 1px solid #a28bff;
      color: #fff;
      font-weight: 700;
      font-size: 0.75rem;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 3px 0 #341f8c;
    }
    .ai-btn:active { transform: translateY(3px); box-shadow: none; }
    .ai-btn:disabled { opacity: 0.6; }

    .option-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 8px;
    }

    .option-btn {
      flex: 1;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 12px;
      background: #20232c;
      color: var(--text);
      border: 1px solid #303543;
      border-radius: 10px;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 3px 0 #0d0e12;
    }
    .option-btn:active { transform: translateY(3px); box-shadow: none; }

    .del-btn {
      padding: 10px;
      font-size: 0.78rem;
      background: #1c1e26;
      color: var(--muted);
      border: 1px solid #2d313e;
      border-radius: 10px;
      cursor: pointer;
    }

    .add-row { display: flex; gap: 6px; margin-top: 10px; }
    input {
      flex: 1;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid #303543;
      background: #0e1014;
      color: var(--text);
      font-size: 0.84rem;
    }

    /* Step 3: 锁定任务 & 鼓励语录屏幕 */
    .lock-screen {
      background: #111318;
      border: 2px solid #090a0d;
      border-radius: 16px;
      padding: 22px 16px;
      text-align: center;
      box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.85);
    }

    .mode-pill {
      display: inline-block;
      background: rgba(255, 90, 54, 0.16);
      border: 1px solid rgba(255, 90, 54, 0.45);
      color: #ff8c73;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
      letter-spacing: 0.05em;
    }

    .task-display {
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.4;
      margin: 0 0 22px 0;
      color: #ffffff;
    }

    .big-hw-btn {
      width: 100%;
      padding: 14px;
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      border-radius: 14px;
      cursor: pointer;
      border: 1px solid #34d399;
      background: linear-gradient(180deg, #10b981 0%, #059669 100%);
      color: #042117;
      box-shadow: 0 4px 0 #044e36;
    }
    .big-hw-btn:active { transform: translateY(4px); box-shadow: none; }

    .big-hw-btn.secondary {
      border-color: #60a5fa;
      background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%);
      color: #ffffff;
      box-shadow: 0 4px 0 #17347a;
    }
    .big-hw-btn.secondary:active { transform: translateY(4px); box-shadow: none; }

    .quote-text {
      font-size: 1.05rem;
      line-height: 1.55;
      margin: 8px 0 10px 0;
      color: #f8fafc;
    }
    .quote-author {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .hardware-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      padding: 8px 6px 0 6px;
      border-top: 1px solid #2a2e39;
      font-size: 0.68rem;
      color: #6b7280;
    }

    .speaker-grill {
      display: flex;
      gap: 4px;
    }
    .speaker-grill span {
      width: 3px;
      height: 10px;
      background: #0d0e12;
      border-radius: 2px;
      box-shadow: 0 1px 0 rgba(255,255,255,0.06);
    }

    #settings {
      display: none;
      background: #14161c;
      border: 1px solid #2e323e;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>
  <div class="gadget-chassis">
    <!-- 顶部硬件机身铭牌 -->
    <div class="hardware-top">
      <div class="brand-tag">
        <span class="led-dot" id="statusLed"></span>
        <span>DOPA-01 // POCKET</span>
      </div>
      <button class="hw-mini-btn" onclick="toggleSettings()">KEY</button>
    </div>

    <!-- API Key 抽屉 -->
    <div id="settings">
      <div style="font-size:0.76rem; font-weight:700; margin-bottom:6px; color:#cbd5e1;">
        GEMINI API KEY (LOCAL STORAGE)
      </div>
      <div class="add-row" style="margin-top:0;">
        <input type="password" id="apiKeyInput" placeholder="AIzaSy..." />
        <button class="hw-mini-btn" onclick="saveKey()">SAVE</button>
      </div>
      <div style="font-size:0.68rem; color:var(--muted); margin-top:6px;">
        Free key: aistudio.google.com
      </div>
    </div>

    <!-- 顶部内嵌 OLED 状态显示屏 -->
    <div class="oled-screen">
      <div class="screen-status-bar">
        <span id="screenStepTag">MODE: SELECT</span>
        <span id="screenCountTag">READY</span>
      </div>
      <div class="screen-readout" id="screenReadout">
        Pick a module or press ROULETTE
      </div>
    </div>

    <!-- STEP 1: 5 个正方形分类按键 + 1 个对称 Roulette 按键 -->
    <section id="step-categories" class="step active">
      <div class="grid" id="categoryGrid"></div>
    </section>

    <!-- STEP 2: 选中分类后的选项列表 -->
    <section id="step-options" class="step">
      <div class="panel-box">
        <div class="top-bar">
          <button class="hw-mini-btn" onclick="goToCategories()">◀ BACK</button>
          <strong id="selectedCatHeading" style="font-size:0.9rem;">⚽ SPORTS</strong>
          <button class="ai-btn" id="aiBtn" onclick="refreshWithAI()">✨ AI REFRESH</button>
        </div>

        <div id="optionList"></div>

        <div class="add-row">
          <input type="text" id="newItem" placeholder="New activity..." onkeydown="if(event.key==='Enter') addItem()" />
          <button class="hw-mini-btn" onclick="addItem()">+ ADD</button>
        </div>
      </div>
    </section>

    <!-- STEP 3A: 锁定当前任务直到按下 DONE -->
    <section id="step-active-task" class="step">
      <div class="lock-screen">
        <div class="mode-pill" id="activeTaskCategory">ACTIVE TASK</div>
        <h2 class="task-display" id="activeTaskText">Your chosen option</h2>
        <button class="big-hw-btn" onclick="completeTask()">[ DONE ]</button>
      </div>
    </section>

    <!-- STEP 3B: 按下 DONE 后显示正向鼓励语录 -->
    <section id="step-quote" class="step">
      <div class="lock-screen">
        <div class="mode-pill" style="background:rgba(16,185,129,0.16); border-color:rgba(16,185,129,0.45); color:#6ee7b7;">
          TASK COMPLETE
        </div>
        <p class="quote-text" id="encouragementQuote">"Small steps build real momentum."</p>
        <div class="quote-author" id="encouragementAuthor">— MOMENTUM</div>
        <button class="big-hw-btn secondary" onclick="goToCategories()">[ RETURN TO MENU ]</button>
      </div>
    </section>

    <!-- 底部硬件装饰孔与型号 -->
    <div class="hardware-footer">
      <span>DOPAMINE SYNTH // V1.0</span>
      <div class="speaker-grill">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <script>
    const categories = [
      { id: "Sports", icon: "⚽" },
      { id: "Eat", icon: "🍜" },
      { id: "Social", icon: "💬" },
      { id: "Self-Improve", icon: "📚" },
      { id: "Entertainment", icon: "🎮" }
    ];

    const defaultMenu = {
      "Sports": [
        "15-min brisk walk or jog",
        "20 pushups & 30 squats",
        "10-min full body stretch",
        "Jump rope for 5 minutes"
      ],
      "Eat": [
        "Make an iced coffee or tea",
        "Eat a bowl of fresh fruit",
        "Cook a quick protein snack",
        "Grab a favorite local treat"
      ],
      "Social": [
        "Send a funny meme to a friend",
        "Call a family member to catch up",
        "Reply to an unread message",
        "Plan a quick hangout this week"
      ],
      "Self-Improve": [
        "Read 10 pages of a book",
        "Tidy your desk for 5 minutes",
        "Write down 3 goals for tomorrow",
        "Practice a skill for 15 minutes"
      ],
      "Entertainment": [
        "Listen to 2 favorite songs",
        "Watch 1 short YouTube video",
        "Play 15 mins of a game",
        "Sketch or doodle for 10 mins"
      ]
    };

    const encouragementQuotes = [
      { text: "Small steps done consistently carry more power than bursts of intensity.", author: "MOMENTUM" },
      { text: "You showed up for yourself today—that alone is a win.", author: "CONSISTENCY" },
      { text: "Energy follows action. Even a small reset changes the rhythm of your day.", author: "RESET" },
      { text: "Progress doesn't have to be loud or dramatic to be real.", author: "QUIET PROGRESS" },
      { text: "Taking care of your energy is part of doing good work.", author: "BALANCE" },
      { text: "One completed choice at a time—you're moving forward.", author: "FORWARD" }
    ];

    let menu = JSON.parse(localStorage.getItem("dopamineMenuV4")) || defaultMenu;
    let optionHistory = JSON.parse(localStorage.getItem("dopamineHistoryV4")) || JSON.parse(JSON.stringify(defaultMenu));
    let activeTask = JSON.parse(localStorage.getItem("dopamineActiveTaskV4")) || null;
    let currentCat = "Sports";
    let isRolling = false;

    // 轻微硬件按压震动反馈（Android Chrome 支持）
    function haptic(ms = 18) {
      if (navigator.vibrate) {
        navigator.vibrate(ms);
      }
    }

    function setLedBusy(busy) {
      const led = document.getElementById("statusLed");
      if (busy) led.classList.add("busy");
      else led.classList.remove("busy");
    }

    function updateScreen(stepTag, countTag, readoutText) {
      document.getElementById("screenStepTag").textContent = stepTag;
      document.getElementById("screenCountTag").textContent = countTag;
      document.getElementById("screenReadout").textContent = readoutText;
    }

    function saveData() {
      localStorage.setItem("dopamineMenuV4", JSON.stringify(menu));
      localStorage.setItem("dopamineHistoryV4", JSON.stringify(optionHistory));
      if (activeTask) {
        localStorage.setItem("dopamineActiveTaskV4", JSON.stringify(activeTask));
      } else {
        localStorage.removeItem("dopamineActiveTaskV4");
      }
    }

    function recordHistory(cat, items) {
      if (!optionHistory[cat]) optionHistory[cat] = [];
      items.forEach(item => {
        if (!optionHistory[cat].includes(item)) {
          optionHistory[cat].push(item);
        }
      });
      if (optionHistory[cat].length > 25) {
        optionHistory[cat] = optionHistory[cat].slice(-25);
      }
    }

    function showStep(stepId) {
      document.querySelectorAll(".step").forEach(sec => sec.classList.remove("active"));
      document.getElementById(stepId).classList.add("active");
    }

    function getTotalOptionsCount() {
      return categories.reduce((sum, cat) => sum + (menu[cat.id] || []).length, 0);
    }

    function renderCategoryGrid() {
      const grid = document.getElementById("categoryGrid");
      const categoryTiles = categories.map(cat => `
        <button class="tactile-key" onclick="openCategory('${cat.id}')">
          <span class="key-icon">${cat.icon}</span>
          <span class="key-label">${cat.id}</span>
          <span class="key-sub">${(menu[cat.id] || []).length} OPT</span>
        </button>
      `).join("");

      const rouletteTile = `
        <button class="tactile-key roulette-key" id="rouletteBoxBtn" onclick="runRoulette()">
          <span class="key-icon">🎲</span>
          <span class="key-label">Roulette</span>
          <span class="key-sub" id="rouletteCountText">${getTotalOptionsCount()} POOL</span>
        </button>
      `;

      grid.innerHTML = categoryTiles + rouletteTile;
      updateScreen("MODE: SELECT", `${getTotalOptionsCount()} ITEMS`, "Select a key or press ROULETTE");
    }

    function openCategory(catId) {
      if (isRolling) return;
      haptic(20);
      currentCat = catId;
      const catObj = categories.find(c => c.id === catId);
      document.getElementById("selectedCatHeading").textContent = `${catObj.icon} ${catObj.id.toUpperCase()}`;
      renderOptionsList();
      showStep("step-options");
    }

    function renderOptionsList() {
      const list = document.getElementById("optionList");
      const items = menu[currentCat] || [];
      updateScreen(`CAT: ${currentCat.toUpperCase()}`, `${items.length} OPTIONS`, "Tap an option to lock task");

      if (!items.length) {
        list.innerHTML = `<p style="color:var(--muted); font-size:0.82rem;">Empty bank. Add one or hit AI REFRESH.</p>`;
        return;
      }

      list.innerHTML = items.map((item, idx) => `
        <div class="option-row">
          <button class="option-btn" onclick="chooseOption(${idx})">
            <span>${item}</span>
            <span style="color:var(--muted); font-size:0.75rem;">▶</span>
          </button>
          <button class="del-btn" onclick="removeItem(${idx})">✕</button>
        </div>
      `).join("");
    }

    function chooseOption(idx) {
      haptic(30);
      const catObj = categories.find(c => c.id === currentCat);
      const chosenText = menu[currentCat][idx];
      activeTask = {
        categoryLabel: `${catObj.icon} ${catObj.id.toUpperCase()}`,
        text: chosenText
      };
      saveData();
      renderActiveTask();
      showStep("step-active-task");
    }

    function renderActiveTask() {
      if (!activeTask) return;
      setLedBusy(true);
      document.getElementById("activeTaskCategory").textContent = activeTask.categoryLabel;
      document.getElementById("activeTaskText").textContent = activeTask.text;
      updateScreen("MODE: LOCKED", "IN PROGRESS", "Press [ DONE ] when finished");
    }

    function completeTask() {
      haptic([25, 40, 25]);
      activeTask = null;
      setLedBusy(false);
      saveData();
      const q = encouragementQuotes[Math.floor(Math.random() * encouragementQuotes.length)];
      document.getElementById("encouragementQuote").textContent = `"${q.text}"`;
      document.getElementById("encouragementAuthor").textContent = `— ${q.author}`;
      updateScreen("MODE: COMPLETE", "DONE", "Session logged. Well done.");
      showStep("step-quote");
    }

    function goToCategories() {
      if (isRolling) return;
      haptic(15);
      setLedBusy(false);
      renderCategoryGrid();
      showStep("step-categories");
    }

    function addItem() {
      const input = document.getElementById("newItem");
      const val = input.value.trim();
      if (!val) return;
      haptic(15);
      menu[currentCat].push(val);
      recordHistory(currentCat, [val]);
      input.value = "";
      saveData();
      renderOptionsList();
    }

    function removeItem(idx) {
      haptic(15);
      menu[currentCat].splice(idx, 1);
      saveData();
      renderOptionsList();
    }

    function runRoulette() {
      if (isRolling) return;

      const pool = [];
      categories.forEach(cat => {
        (menu[cat.id] || []).forEach(option => {
          pool.push({ categoryLabel: `${cat.icon} ${cat.id.toUpperCase()}`, text: option });
        });
      });

      if (!pool.length) {
        return alert("Add at least one option to a category first!");
      }

      isRolling = true;
      setLedBusy(true);
      haptic(25);

      const boxBtn = document.getElementById("rouletteBoxBtn");
      const countText = document.getElementById("rouletteCountText");
      if (boxBtn) boxBtn.disabled = true;
      if (countText) countText.textContent = "ROLLING";

      let ticks = 0;
      const totalTicks = 16;
      const interval = setInterval(() => {
        const temp = pool[Math.floor(Math.random() * pool.length)];
        updateScreen("ROULETTE: SCANNING", `${ticks + 1}/${totalTicks}`, `${temp.categoryLabel} · ${temp.text}`);
        haptic(8);
        ticks++;

        if (ticks >= totalTicks) {
          clearInterval(interval);
          const finalPick = pool[Math.floor(Math.random() * pool.length)];
          activeTask = finalPick;
          saveData();
          if (boxBtn) boxBtn.disabled = false;
          isRolling = false;
          haptic(40);
          renderActiveTask();
          showStep("step-active-task");
        }
      }, 75);
    }

    function toggleSettings() {
      haptic(15);
      const s = document.getElementById("settings");
      s.style.display = s.style.display === "none" ? "block" : "none";
      document.getElementById("apiKeyInput").value = localStorage.getItem("geminiKey") || "";
    }

    function saveKey() {
      haptic(20);
      localStorage.setItem("geminiKey", document.getElementById("apiKeyInput").value.trim());
      toggleSettings();
      alert("API Key saved on this device!");
    }

    async function refreshWithAI() {
      if (isRolling) return;
      const key = localStorage.getItem("geminiKey");
      if (!key) {
        toggleSettings();
        return alert("Paste your free Gemini API key first.");
      }

      haptic(20);
      setLedBusy(true);
      const btn = document.getElementById("aiBtn");
      const prevLabel = btn.textContent;
      btn.textContent = "SYNTH...";
      btn.disabled = true;
      updateScreen("AI: GENERATING", currentCat.toUpperCase(), "Synthesizing ideas from history...");

      const currentItems = menu[currentCat] || [];
      const pastItems = optionHistory[currentCat] || [];

      const prompt = `You are curating a personal dopamine menu for the category "${currentCat}".
Here are the user's current and past options in this category:
${pastItems.map(i => `- ${i}`).join("\n")}

Infer the user's preferences, tone, and effort style from those options, then generate 4 NEW, creative, specific, and engaging activity options for "${currentCat}" that fit their taste without duplicating existing options (${currentItems.join(", ")}).
Keep each item clear and concise (under 50 characters).
Return ONLY a raw JSON array of 4 strings, no markdown, no extra text.`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${key}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await res.json();
        const rawText = data.candidates[0].content.parts[0].text.replace(/```json|```/g, "").trim();
        const freshItems = JSON.parse(rawText);

        if (Array.isArray(freshItems) && freshItems.length > 0) {
          menu[currentCat] = freshItems;
          recordHistory(currentCat, freshItems);
          saveData();
          haptic(30);
          renderOptionsList();
        }
      } catch (err) {
        alert("AI refresh failed—check your API key or internet connection.");
        renderOptionsList();
      } finally {
        setLedBusy(false);
        btn.textContent = prevLabel;
        btn.disabled = false;
      }
    }

    if (activeTask) {
      renderActiveTask();
      showStep("step-active-task");
    } else {
      renderCategoryGrid();
      showStep("step-categories");
    }
  </script>
</body>
</html>
