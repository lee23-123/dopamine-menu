<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d0f14" />
  <link rel="manifest" href="manifest.json" />
  <title>DOPA-01 Mobile</title>
  <style>
    :root {
      --bg: #0d0f14;
      --chassis: #181b23;
      --border: #2c3140;
      --key-bg: #232734;
      --key-shadow: #0b0c10;
      --accent: #ff5a36;
      --green: #10b981;
      --text: #f5f7fa;
      --muted: #949cb0;
    }

    * {
      box-sizing: border-box;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 12px;
    }

    /* 手机端全宽顺手，电脑端限制在舒适掌机宽度 */
    .app-shell {
      width: 100%;
      max-width: 440px;
      background: linear-gradient(180deg, #1d202a 0%, #13151c 100%);
      border: 1.5px solid var(--border);
      border-radius: 24px;
      padding: 14px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.55);
    }

    /* 顶部状态栏 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: #0f1117;
      border: 1px solid #242936;
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }

    .status-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .led {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      flex-shrink: 0;
    }
    .led.busy {
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .status-text {
      font-size: 0.82rem;
      font-weight: 700;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-sm {
      background: #252938;
      color: #f1f5f9;
      border: 1px solid #394054;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 3px 0 var(--key-shadow);
    }
    .btn-sm:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    .step { display: none; }
    .step.active { display: block; }

    /* STEP 1: 6 个大触控方格 (5 分类 + 1 Roulette) */
    .grid-6 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .tile-btn {
      aspect-ratio: 1 / 1.05;
      min-width: 0;
      background: linear-gradient(180deg, #272b3a 0%, #1d202b 100%);
      border: 1px solid #363c4f;
      border-radius: 18px;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 6px;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--key-shadow);
    }
    .tile-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--key-shadow);
    }

    .tile-btn.roulette {
      background: linear-gradient(180deg, #ff6947 0%, #d94120 100%);
      border-color: #ff8d73;
      color: #ffffff;
      box-shadow: 0 4px 0 #781f0c;
    }
    .tile-btn.roulette:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #781f0c;
    }

    .tile-icon {
      font-size: 1.85rem;
      line-height: 1;
    }
    .tile-title {
      width: 100%;
      font-size: 0.78rem;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tile-sub {
      font-size: 0.7rem;
      opacity: 0.78;
    }

    /* STEP 2: 选项列表（手指好点、好滑、好输入） */
    .nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .cat-heading {
      font-size: 0.95rem;
      font-weight: 700;
      text-align: center;
      flex: 1;
    }

    .ai-btn {
      background: linear-gradient(180deg, #8b6eff 0%, #6342e6 100%);
      border: 1px solid #a68cff;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.78rem;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 3px 0 #321d8a;
    }
    .ai-btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }
    .ai-btn:disabled { opacity: 0.6; }

    .option-item {
      display: flex;
      gap: 8px;
      align-items: stretch;
      margin-bottom: 10px;
    }

    .option-choose {
      flex: 1;
      min-width: 0;
      min-height: 48px;
      background: #222634;
      color: var(--text);
      border: 1px solid #343a4d;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 0.9rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      box-shadow: 0 3px 0 var(--key-shadow);
    }
    .option-choose:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    .option-del {
      width: 46px;
      background: #1b1e29;
      color: var(--muted);
      border: 1px solid #2f3547;
      border-radius: 14px;
      font-size: 0.88rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .add-box {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    input {
      flex: 1;
      min-width: 0;
      min-height: 44px;
      background: #0e1016;
      color: var(--text);
      border: 1px solid #343a4d;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.88rem;
    }

    /* STEP 3A & 3B: 锁定任务 / 正向鼓励语录 */
    .lock-card {
      background: #101218;
      border: 1.5px solid #262b3a;
      border-radius: 20px;
      padding: 24px 18px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: rgba(255, 90, 54, 0.16);
      border: 1px solid rgba(255, 90, 54, 0.45);
      color: #ff8e75;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .badge.done {
      background: rgba(16, 185, 129, 0.16);
      border-color: rgba(16, 185, 129, 0.45);
      color: #6ee7b7;
    }

    .task-text {
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.45;
      margin: 0 0 24px 0;
      word-break: break-word;
    }

    .quote-text {
      font-size: 1.05rem;
      line-height: 1.6;
      margin: 0 0 24px 0;
      color: #f8fafc;
    }

    .primary-btn {
      width: 100%;
      min-height: 52px;
      padding: 14px;
      font-size: 0.98rem;
      font-weight: 700;
      border-radius: 14px;
      border: 1px solid #34d399;
      background: linear-gradient(180deg, #10b981 0%, #059669 100%);
      color: #042117;
      cursor: pointer;
      box-shadow: 0 4px 0 #044e36;
    }
    .primary-btn:active {
      transform: translateY(3px);
      box-shadow: none;
    }

    .primary-btn.blue {
      border-color: #60a5fa;
      background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%);
      color: #ffffff;
      box-shadow: 0 4px 0 #17347a;
    }
    .primary-btn.blue:active {
      transform: translateY(3px);
      box-shadow: none;
    }

    /* API Key 面板 */
    #keyPanel {
      display: none;
      background: #12151d;
      border: 1px solid #2e3447;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="top-bar">
      <div class="status-wrap">
        <span class="led" id="ledDot"></span>
        <span class="status-text" id="statusText">DOPA-01 // READY</span>
      </div>
      <button class="btn-sm" onclick="toggleKeyPanel()">KEY</button>
    </div>

    <div id="keyPanel">
      <div style="font-size:0.78rem; font-weight:700; margin-bottom:8px;">GEMINI API KEY (THIS DEVICE)</div>
      <div class="add-box" style="margin-top:0;">
        <input type="password" id="apiKeyInput" placeholder="Paste AIzaSy... key" />
        <button class="btn-sm" onclick="saveApiKey()">SAVE</button>
      </div>
    </div>

    <!-- STEP 1: 5 分类 + 1 Roulette -->
    <section id="step-categories" class="step active">
      <div class="grid-6" id="categoryGrid"></div>
    </section>

    <!-- STEP 2: 选项管理与选择 -->
    <section id="step-options" class="step">
      <div class="nav-row">
        <button class="btn-sm" onclick="goToCategories()">◀ BACK</button>
        <div class="cat-heading" id="catHeading">⚽ SPORTS</div>
        <button class="ai-btn" id="aiBtn" onclick="refreshWithAI()">✨ AI REFRESH</button>
      </div>

      <div id="optionList"></div>

      <div class="add-box">
        <input type="text" id="newItemInput" placeholder="Add new option..." onkeydown="if(event.key==='Enter') addOption()" />
        <button class="btn-sm" onclick="addOption()">+ ADD</button>
      </div>
    </section>

    <!-- STEP 3A: 锁定当前任务直到按下 DONE -->
    <section id="step-active-task" class="step">
      <div class="lock-card">
        <div class="badge" id="activeCatBadge">LOCKED TASK</div>
        <h2 class="task-text" id="activeTaskText">Your task</h2>
        <button class="primary-btn" onclick="completeTask()">[ DONE ]</button>
      </div>
    </section>

    <!-- STEP 3B: 完成后显示正向鼓励语录 -->
    <section id="step-quote" class="step">
      <div class="lock-card">
        <div class="badge done">COMPLETED</div>
        <p class="quote-text" id="quoteText">"Small steps done consistently carry real momentum."</p>
        <button class="primary-btn blue" onclick="goToCategories()">[ BACK TO MENU ]</button>
      </div>
    </section>
  </div>

  <script>
    const categories = [
      { id: "Sports", icon: "⚽" },
      { id: "Eat", icon: "🍜" },
      { id: "Social", icon: "💬" },
      { id: "Self-Improve", icon: "📚" },
      { id: "Entertainment", icon: "🎮" }
    ];

    const defaultMenu = {
      "Sports": [
        "15-min brisk walk or jog",
        "20 pushups & 30 squats",
        "10-min full body stretch",
        "Jump rope for 5 minutes"
      ],
      "Eat": [
        "Make an iced coffee or tea",
        "Eat a bowl of fresh fruit",
        "Cook a quick protein snack",
        "Grab a favorite local treat"
      ],
      "Social": [
        "Send a funny meme to a friend",
        "Call a family member to catch up",
        "Reply to an unread message",
        "Plan a quick hangout this week"
      ],
      "Self-Improve": [
        "Read 10 pages of a book",
        "Tidy your desk for 5 minutes",
        "Write down 3 goals for tomorrow",
        "Practice a skill for 15 minutes"
      ],
      "Entertainment": [
        "Listen to 2 favorite songs",
        "Watch 1 short YouTube video",
        "Play 15 mins of a game",
        "Sketch or doodle for 10 mins"
      ]
    };

    const encouragementQuotes = [
      "Small steps done consistently carry more power than bursts of intensity.",
      "You showed up for yourself today—that alone is a win.",
      "Energy follows action. Even a small reset changes the rhythm of your day.",
      "Progress doesn't have to be loud or dramatic to be real.",
      "Taking care of your energy is part of doing good work.",
      "One completed choice at a time—you're moving forward."
    ];

    let menu = JSON.parse(localStorage.getItem("dopamineMenuV4")) || defaultMenu;
    let optionHistory = JSON.parse(localStorage.getItem("dopamineHistoryV4")) || JSON.parse(JSON.stringify(defaultMenu));
    let activeTask = JSON.parse(localStorage.getItem("dopamineActiveTaskV4")) || null;
    let currentCat = "Sports";
    let isRolling = false;

    function haptic(ms = 18) {
      if (navigator.vibrate) navigator.vibrate(ms);
    }

    function setLed(busy) {
      const dot = document.getElementById("ledDot");
      if (busy) dot.classList.add("busy");
      else dot.classList.remove("busy");
    }

    function setStatus(text) {
      document.getElementById("statusText").textContent = text;
    }

    function saveData() {
      localStorage.setItem("dopamineMenuV4", JSON.stringify(menu));
      localStorage.setItem("dopamineHistoryV4", JSON.stringify(optionHistory));
      if (activeTask) localStorage.setItem("dopamineActiveTaskV4", JSON.stringify(activeTask));
      else localStorage.removeItem("dopamineActiveTaskV4");
    }

    function recordHistory(cat, items) {
      if (!optionHistory[cat]) optionHistory[cat] = [];
      items.forEach(item => {
        if (!optionHistory[cat].includes(item)) optionHistory[cat].push(item);
      });
      if (optionHistory[cat].length > 25) optionHistory[cat] = optionHistory[cat].slice(-25);
    }

    function showStep(stepId) {
      document.querySelectorAll(".step").forEach(sec => sec.classList.remove("active"));
      document.getElementById(stepId).classList.add("active");
    }

    function getTotalOptions() {
      return categories.reduce((sum, cat) => sum + (menu[cat.id] || []).length, 0);
    }

    function renderCategoryGrid() {
      const grid = document.getElementById("categoryGrid");
      const tiles = categories.map(cat => `
        <button class="tile-btn" onclick="openCategory('${cat.id}')">
          <span class="tile-icon">${cat.icon}</span>
          <span class="tile-title">${cat.id}</span>
          <span class="tile-sub">${(menu[cat.id] || []).length} opt</span>
        </button>
      `).join("");

      const roulette = `
        <button class="tile-btn roulette" id="rouletteBtn" onclick="runRoulette()">
          <span class="tile-icon">🎲</span>
          <span class="tile-title">Roulette</span>
          <span class="tile-sub" id="rouletteSub">${getTotalOptions()} pool</span>
        </button>
      `;

      grid.innerHTML = tiles + roulette;
      setStatus("PICK A CATEGORY OR ROULETTE");
    }

    function openCategory(catId) {
      if (isRolling) return;
      haptic(18);
      currentCat = catId;
      const catObj = categories.find(c => c.id === catId);
      document.getElementById("catHeading").textContent = `${catObj.icon} ${catObj.id.toUpperCase()}`;
      renderOptionsList();
      showStep("step-options");
    }

    function renderOptionsList() {
      const list = document.getElementById("optionList");
      const items = menu[currentCat] || [];
      setStatus(`${currentCat.toUpperCase()} // ${items.length} OPTIONS`);

      if (!items.length) {
        list.innerHTML = `<p style="color:var(--muted); font-size:0.85rem; text-align:center; padding:16px 0;">No options yet. Add one below or tap AI REFRESH.</p>`;
        return;
      }

      list.innerHTML = items.map((item, idx) => `
        <div class="option-item">
          <button class="option-choose" onclick="chooseOption(${idx})">
            <span>${item}</span>
            <span style="color:var(--muted);">▶</span>
          </button>
          <button class="option-del" onclick="removeOption(${idx})">✕</button>
        </div>
      `).join("");
    }

    function chooseOption(idx) {
      haptic(28);
      const catObj = categories.find(c => c.id === currentCat);
      activeTask = {
        categoryLabel: `${catObj.icon} ${catObj.id.toUpperCase()}`,
        text: menu[currentCat][idx]
      };
      saveData();
      renderActiveTask();
      showStep("step-active-task");
    }

    function renderActiveTask() {
      if (!activeTask) return;
      setLed(true);
      document.getElementById("activeCatBadge").textContent = activeTask.categoryLabel;
      document.getElementById("activeTaskText").textContent = activeTask.text;
      setStatus("LOCKED // FINISH TO UNLOCK");
    }

    function completeTask() {
      haptic([25, 35, 25]);
      activeTask = null;
      setLed(false);
      saveData();
      const q = encouragementQuotes[Math.floor(Math.random() * encouragementQuotes.length)];
      document.getElementById("quoteText").textContent = `"${q}"`;
      setStatus("COMPLETED // GREAT JOB");
      showStep("step-quote");
    }

    function goToCategories() {
      if (isRolling) return;
      haptic(15);
      setLed(false);
      renderCategoryGrid();
      showStep("step-categories");
    }

    function addOption() {
      const input = document.getElementById("newItemInput");
      const val = input.value.trim();
      if (!val) return;
      haptic(15);
      menu[currentCat].push(val);
      recordHistory(currentCat, [val]);
      input.value = "";
      saveData();
      renderOptionsList();
    }

    function removeOption(idx) {
      haptic(15);
      menu[currentCat].splice(idx, 1);
      saveData();
      renderOptionsList();
    }

    function runRoulette() {
      if (isRolling) return;
      const pool = [];
      categories.forEach(cat => {
        (menu[cat.id] || []).forEach(option => {
          pool.push({ categoryLabel: `${cat.icon} ${cat.id.toUpperCase()}`, text: option });
        });
      });
      if (!pool.length) return alert("Add at least one option first!");

      isRolling = true;
      setLed(true);
      const btn = document.getElementById("rouletteBtn");
      if (btn) btn.disabled = true;

      let ticks = 0;
      const totalTicks = 15;
      const timer = setInterval(() => {
        const temp = pool[Math.floor(Math.random() * pool.length)];
        setStatus(`ROLLING: ${temp.text}`);
        haptic(8);
        ticks++;
        if (ticks >= totalTicks) {
          clearInterval(interval);
          activeTask = pool[Math.floor(Math.random() * pool.length)];
          saveData();
          if (btn) btn.disabled = false;
          isRolling = false;
          haptic(38);
          renderActiveTask();
          showStep("step-active-task");
        }
      }, 75);
    }

    function toggleKeyPanel() {
      const panel = document.getElementById("keyPanel");
      panel.style.display = panel.style.display === "block" ? "none" : "block";
      document.getElementById("apiKeyInput").value = localStorage.getItem("geminiKey") || "";
    }

    function saveApiKey() {
      haptic(20);
      localStorage.setItem("geminiKey", document.getElementById("apiKeyInput").value.trim());
      toggleKeyPanel();
      alert("API Key saved on this device!");
    }

    async function refreshWithAI() {
      if (isRolling) return;
      const key = localStorage.getItem("geminiKey");
      if (!key) {
        toggleKeyPanel();
        return alert("Paste your free Gemini API key first.");
      }

      haptic(20);
      setLed(true);
      const btn = document.getElementById("aiBtn");
      const oldText = btn.textContent;
      btn.textContent = "GEN...";
      btn.disabled = true;
      setStatus(`AI SYNTHESIZING ${currentCat.toUpperCase()}...`);

      const currentItems = menu[currentCat] || [];
      const pastItems = optionHistory[currentCat] || [];

      const prompt = `You are curating a personal dopamine menu for the category "${currentCat}".
Here are the user's current and past options in this category:
${pastItems.map(i => `- ${i}`).join("\n")}

Infer the user's preferences, tone, and effort style from those options, then generate 4 NEW, creative, specific, and engaging activity options for "${currentCat}" that fit their taste without duplicating existing options (${currentItems.join(", ")}).
Keep each item clear and concise (under 48 characters).
Return ONLY a raw JSON array of 4 strings, no markdown, no extra text.`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${key}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await res.json();
        const rawText = data.candidates[0].content.parts[0].text.replace(/```json|```/g, "").trim();
        const freshItems = JSON.parse(rawText);

        if (Array.isArray(freshItems) && freshItems.length > 0) {
          menu[currentCat] = freshItems;
          recordHistory(currentCat, freshItems);
          saveData();
          haptic(28);
          renderOptionsList();
        }
      } catch (err) {
        alert("AI refresh failed—check API key or network.");
        renderOptionsList();
      } finally {
        setLed(false);
        btn.textContent = oldText;
        btn.disabled = false;
      }
    }

    if (activeTask) {
      renderActiveTask();
      showStep("step-active-task");
    } else {
      renderCategoryGrid();
      showStep("step-categories");
    }
  </script>
</body>
</html>
