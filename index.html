<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#14161d" />
  <link rel="manifest" href="manifest.json" />
  <title>DOPA-01 Widget</title>
  <style>
    :root {
      --bg: #14161d;
      --surface: #1e212b;
      --key-bg: #262a36;
      --key-shadow: #0d0e13;
      --accent: #ff5a36;
      --green: #10b981;
      --text: #f3f4f6;
      --muted: #8b92a5;
    }

    * {
      box-sizing: border-box;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
    }

    .widget-shell {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: clamp(6px, 2.5vmin, 12px);
      gap: clamp(6px, 2vmin, 10px);
      background: linear-gradient(180deg, #1b1e27 0%, #12141a 100%);
      border: 1.5px solid #2d3240;
      border-radius: 18px;
      overflow: hidden;
    }

    .top-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f1116;
      border: 1px solid #252936;
      border-radius: 10px;
      padding: 4px 8px;
      flex-shrink: 0;
      width: 100%;
      min-width: 0;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .led {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      flex-shrink: 0;
    }
    .led.busy {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .readout {
      font-size: clamp(0.65rem, 2.8vmin, 0.78rem);
      font-weight: 700;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-btn {
      background: #252936;
      color: #e2e8f0;
      border: 1px solid #363c4f;
      border-radius: 6px;
      padding: 2px 7px;
      font-size: clamp(0.62rem, 2.5vmin, 0.72rem);
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    .main-area {
      flex: 1;
      min-height: 0;
      min-width: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    .step {
      display: none;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
    }
    .step.active {
      display: flex;
      flex-direction: column;
    }

    /* 关键修复：minmax(0, 1fr) 强制三列严格等宽，绝不被长单词撑出外框 */
    .grid-6 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: clamp(5px, 1.8vmin, 9px);
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
    }

    .key-tile {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      margin: 0;
      overflow: hidden;
      background: linear-gradient(180deg, #282c38 0%, #1e212b 100%);
      border: 1px solid #363c4d;
      border-radius: 12px;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 3px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .key-tile:active {
      transform: scale(0.97);
    }

    .key-tile.roulette {
      background: linear-gradient(180deg, #ff6847 0%, #d94323 100%);
      border-color: #ff8a70;
      color: #fff;
    }

    .tile-icon {
      font-size: clamp(1rem, 5vmin, 1.55rem);
      line-height: 1.1;
    }
    .tile-name {
      width: 100%;
      font-size: clamp(0.56rem, 2.3vmin, 0.74rem);
      font-weight: 700;
      text-align: center;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tile-meta {
      font-size: clamp(0.52rem, 2vmin, 0.64rem);
      opacity: 0.72;
    }

    .sub-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
      margin-bottom: 6px;
      flex-shrink: 0;
      width: 100%;
    }

    .ai-btn {
      background: linear-gradient(180deg, #8b6eff 0%, #6544e8 100%);
      border: 1px solid #a28bff;
      color: #fff;
      font-weight: 700;
      font-size: clamp(0.6rem, 2.4vmin, 0.72rem);
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .options-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding-right: 2px;
    }

    .opt-row {
      display: flex;
      gap: 4px;
      align-items: stretch;
      min-width: 0;
    }

    .opt-btn {
      flex: 1;
      min-width: 0;
      text-align: left;
      background: #222631;
      color: var(--text);
      border: 1px solid #323848;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: clamp(0.68rem, 2.7vmin, 0.8rem);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .opt-btn span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .del-btn {
      background: #1b1e27;
      color: var(--muted);
      border: 1px solid #2e3342;
      border-radius: 8px;
      padding: 0 7px;
      font-size: 0.7rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .add-bar {
      display: flex;
      gap: 4px;
      margin-top: 6px;
      flex-shrink: 0;
    }

    input {
      flex: 1;
      min-width: 0;
      background: #0e1015;
      color: var(--text);
      border: 1px solid #323848;
      border-radius: 7px;
      padding: 5px 8px;
      font-size: clamp(0.68rem, 2.6vmin, 0.78rem);
    }

    .center-box {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      background: #101217;
      border: 1px solid #242834;
      border-radius: 12px;
      padding: clamp(8px, 3vmin, 14px);
    }

    .pill {
      background: rgba(255, 90, 54, 0.18);
      border: 1px solid rgba(255, 90, 54, 0.45);
      color: #ff8c73;
      font-size: clamp(0.58rem, 2.3vmin, 0.7rem);
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .center-title {
      font-size: clamp(0.85rem, 3.8vmin, 1.15rem);
      font-weight: 700;
      line-height: 1.3;
      margin: 4px 0;
      word-break: break-word;
    }

    .center-quote {
      font-size: clamp(0.75rem, 3.1vmin, 0.95rem);
      line-height: 1.35;
      margin: 4px 0;
      color: #f8fafc;
    }

    .action-btn {
      width: 100%;
      padding: clamp(7px, 2.5vmin, 11px);
      font-size: clamp(0.75rem, 3vmin, 0.9rem);
      font-weight: 700;
      border-radius: 10px;
      border: 1px solid #34d399;
      background: linear-gradient(180deg, #10b981 0%, #059669 100%);
      color: #042117;
      cursor: pointer;
    }

    .action-btn.blue {
      border-color: #60a5fa;
      background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%);
      color: #fff;
    }

    #settingsOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 11, 15, 0.94);
      padding: 12px;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div class="widget-shell">
    <div class="top-strip">
      <div class="status-left">
        <span class="led" id="ledDot"></span>
        <span class="readout" id="readoutText">DOPA-01 // READY</span>
      </div>
      <button class="mini-btn" onclick="toggleSettings()">KEY</button>
    </div>

    <div class="main-area">
      <section id="step-categories" class="step active">
        <div class="grid-6" id="categoryGrid"></div>
      </section>

      <section id="step-options" class="step">
        <div class="sub-header">
          <button class="mini-btn" onclick="goToCategories()">◀ BACK</button>
          <strong id="catHeader" style="font-size:0.78rem;">⚽ SPORTS</strong>
          <button class="ai-btn" id="aiBtn" onclick="refreshWithAI()">✨ AI</button>
        </div>
        <div class="options-scroll" id="optionList"></div>
        <div class="add-bar">
          <input type="text" id="newItem" placeholder="Add option..." onkeydown="if(event.key==='Enter') addItem()" />
          <button class="mini-btn" onclick="addItem()">+</button>
        </div>
      </section>

      <section id="step-active-task" class="step">
        <div class="center-box">
          <span class="pill" id="activeCatPill">ACTIVE</span>
          <div class="center-title" id="activeTaskText">Task</div>
          <button class="action-btn" onclick="completeTask()">[ DONE ]</button>
        </div>
      </section>

      <section id="step-quote" class="step">
        <div class="center-box">
          <span class="pill" style="background:rgba(16,185,129,0.18); border-color:rgba(16,185,129,0.45); color:#6ee7b7;">
            COMPLETED
          </span>
          <div class="center-quote" id="quoteText">"Small steps build real momentum."</div>
          <button class="action-btn blue" onclick="goToCategories()">[ MENU ]</button>
        </div>
      </section>
    </div>
  </div>

  <div id="settingsOverlay">
    <div style="font-size:0.75rem; font-weight:700;">GEMINI API KEY</div>
    <input type="password" id="apiKeyInput" placeholder="AIzaSy..." />
    <div style="display:flex; gap:6px;">
      <button class="action-btn" style="padding:6px;" onclick="saveKey()">SAVE</button>
      <button class="mini-btn" style="padding:6px 12px;" onclick="toggleSettings()">CLOSE</button>
    </div>
  </div>

  <script>
    const categories = [
      { id: "Sports", icon: "⚽" },
      { id: "Eat", icon: "🍜" },
      { id: "Social", icon: "💬" },
      { id: "Self-Improve", icon: "📚" },
      { id: "Entertainment", icon: "🎮" }
    ];

    const defaultMenu = {
      "Sports": [
        "15-min brisk walk or jog",
        "20 pushups & 30 squats",
        "10-min full body stretch",
        "Jump rope for 5 minutes"
      ],
      "Eat": [
        "Make an iced coffee or tea",
        "Eat a bowl of fresh fruit",
        "Cook a quick protein snack",
        "Grab a favorite local treat"
      ],
      "Social": [
        "Send a funny meme to a friend",
        "Call a family member to catch up",
        "Reply to an unread message",
        "Plan a quick hangout this week"
      ],
      "Self-Improve": [
        "Read 10 pages of a book",
        "Tidy your desk for 5 minutes",
        "Write down 3 goals for tomorrow",
        "Practice a skill for 15 minutes"
      ],
      "Entertainment": [
        "Listen to 2 favorite songs",
        "Watch 1 short YouTube video",
        "Play 15 mins of a game",
        "Sketch or doodle for 10 mins"
      ]
    };

    const encouragementQuotes = [
      "Small steps done consistently carry more power than bursts of intensity.",
      "You showed up for yourself today—that alone is a win.",
      "Energy follows action. Even a small reset changes your day.",
      "Progress doesn't have to be loud or dramatic to be real.",
      "Taking care of your energy is part of doing good work.",
      "One completed choice at a time—you're moving forward."
    ];

    let menu = JSON.parse(localStorage.getItem("dopamineMenuV4")) || defaultMenu;
    let optionHistory = JSON.parse(localStorage.getItem("dopamineHistoryV4")) || JSON.parse(JSON.stringify(defaultMenu));
    let activeTask = JSON.parse(localStorage.getItem("dopamineActiveTaskV4")) || null;
    let currentCat = "Sports";
    let isRolling = false;

    function haptic(ms = 15) {
      if (navigator.vibrate) navigator.vibrate(ms);
    }

    function setLed(busy) {
      const dot = document.getElementById("ledDot");
      if (busy) dot.classList.add("busy");
      else dot.classList.remove("busy");
    }

    function setReadout(text) {
      document.getElementById("readoutText").textContent = text;
    }

    function saveData() {
      localStorage.setItem("dopamineMenuV4", JSON.stringify(menu));
      localStorage.setItem("dopamineHistoryV4", JSON.stringify(optionHistory));
      if (activeTask) localStorage.setItem("dopamineActiveTaskV4", JSON.stringify(activeTask));
      else localStorage.removeItem("dopamineActiveTaskV4");
    }

    function recordHistory(cat, items) {
      if (!optionHistory[cat]) optionHistory[cat] = [];
      items.forEach(item => {
        if (!optionHistory[cat].includes(item)) optionHistory[cat].push(item);
      });
      if (optionHistory[cat].length > 25) optionHistory[cat] = optionHistory[cat].slice(-25);
    }

    function showStep(id) {
      document.querySelectorAll(".step").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    function getTotalCount() {
      return categories.reduce((sum, c) => sum + (menu[c.id] || []).length, 0);
    }

    function renderCategoryGrid() {
      const grid = document.getElementById("categoryGrid");
      const tiles = categories.map(cat => `
        <button class="key-tile" onclick="openCategory('${cat.id}')">
          <span class="tile-icon">${cat.icon}</span>
          <span class="tile-name">${cat.id}</span>
          <span class="tile-meta">${(menu[cat.id] || []).length}</span>
        </button>
      `).join("");

      const roulette = `
        <button class="key-tile roulette" id="rouletteBtn" onclick="runRoulette()">
          <span class="tile-icon">🎲</span>
          <span class="tile-name">Roulette</span>
          <span class="tile-meta" id="rouletteMeta">${getTotalCount()}</span>
        </button>
      `;

      grid.innerHTML = tiles + roulette;
      setReadout("SELECT CATEGORY OR ROULETTE");
    }

    function openCategory(catId) {
      if (isRolling) return;
      haptic(15);
      currentCat = catId;
      const catObj = categories.find(c => c.id === catId);
      document.getElementById("catHeader").textContent = `${catObj.icon} ${catObj.id.toUpperCase()}`;
      renderOptionsList();
      showStep("step-options");
    }

    function renderOptionsList() {
      const list = document.getElementById("optionList");
      const items = menu[currentCat] || [];
      setReadout(`${currentCat.toUpperCase()} (${items.length})`);

      if (!items.length) {
        list.innerHTML = `<div style="color:var(--muted); font-size:0.75rem; text-align:center; padding:12px;">No items. Add below or tap AI.</div>`;
        return;
      }

      list.innerHTML = items.map((item, idx) => `
        <div class="opt-row">
          <button class="opt-btn" onclick="chooseOption(${idx})">
            <span>${item}</span>
            <span style="color:var(--muted);">▶</span>
          </button>
          <button class="del-btn" onclick="removeItem(${idx})">✕</button>
        </div>
      `).join("");
    }

    function chooseOption(idx) {
      haptic(25);
      const catObj = categories.find(c => c.id === currentCat);
      activeTask = {
        categoryLabel: `${catObj.icon} ${catObj.id.toUpperCase()}`,
        text: menu[currentCat][idx]
      };
      saveData();
      renderActiveTask();
      showStep("step-active-task");
    }

    function renderActiveTask() {
      if (!activeTask) return;
      setLed(true);
      document.getElementById("activeCatPill").textContent = activeTask.categoryLabel;
      document.getElementById("activeTaskText").textContent = activeTask.text;
      setReadout("LOCKED // TAP DONE WHEN FINISHED");
    }

    function completeTask() {
      haptic([20, 30, 20]);
      activeTask = null;
      setLed(false);
      saveData();
      const q = encouragementQuotes[Math.floor(Math.random() * encouragementQuotes.length)];
      document.getElementById("quoteText").textContent = `"${q}"`;
      setReadout("COMPLETED // NICE WORK");
      showStep("step-quote");
    }

    function goToCategories() {
      if (isRolling) return;
      haptic(15);
      setLed(false);
      renderCategoryGrid();
      showStep("step-categories");
    }

    function addItem() {
      const input = document.getElementById("newItem");
      const val = input.value.trim();
      if (!val) return;
      menu[currentCat].push(val);
      recordHistory(currentCat, [val]);
      input.value = "";
      saveData();
      renderOptionsList();
    }

    function removeItem(idx) {
      menu[currentCat].splice(idx, 1);
      saveData();
      renderOptionsList();
    }

    function runRoulette() {
      if (isRolling) return;
      const pool = [];
      categories.forEach(cat => {
        (menu[cat.id] || []).forEach(option => {
          pool.push({ categoryLabel: `${cat.icon} ${cat.id.toUpperCase()}`, text: option });
        });
      });
      if (!pool.length) return alert("Add at least one option first!");

      isRolling = true;
      setLed(true);
      const btn = document.getElementById("rouletteBtn");
      if (btn) btn.disabled = true;

      let ticks = 0;
      const totalTicks = 14;
      const timer = setInterval(() => {
        const temp = pool[Math.floor(Math.random() * pool.length)];
        setReadout(`ROLLING: ${temp.text}`);
        haptic(8);
        ticks++;
        if (ticks >= totalTicks) {
          clearInterval(timer);
          activeTask = pool[Math.floor(Math.random() * pool.length)];
          saveData();
          if (btn) btn.disabled = false;
          isRolling = false;
          haptic(35);
          renderActiveTask();
          showStep("step-active-task");
        }
      }, 75);
    }

    function toggleSettings() {
      const box = document.getElementById("settingsOverlay");
      box.style.display = box.style.display === "flex" ? "none" : "flex";
      document.getElementById("apiKeyInput").value = localStorage.getItem("geminiKey") || "";
    }

    function saveKey() {
      localStorage.setItem("geminiKey", document.getElementById("apiKeyInput").value.trim());
      toggleSettings();
    }

    async function refreshWithAI() {
      if (isRolling) return;
      const key = localStorage.getItem("geminiKey");
      if (!key) return toggleSettings();

      setLed(true);
      const btn = document.getElementById("aiBtn");
      btn.textContent = "...";
      btn.disabled = true;
      setReadout("AI SYNTHESIZING...");

      const currentItems = menu[currentCat] || [];
      const pastItems = optionHistory[currentCat] || [];

      const prompt = `Curate 4 NEW, creative, energizing dopamine menu options for "${currentCat}" based on the user's previous/current options:
${pastItems.map(i => `- ${i}`).join("\n")}
Do not repeat: ${currentItems.join(", ")}. Keep each under 40 characters. Return ONLY a raw JSON array of 4 strings.`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${key}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await res.json();
        const rawText = data.candidates[0].content.parts[0].text.replace(/```json|```/g, "").trim();
        const freshItems = JSON.parse(rawText);

        if (Array.isArray(freshItems) && freshItems.length > 0) {
          menu[currentCat] = freshItems;
          recordHistory(currentCat, freshItems);
          saveData();
          renderOptionsList();
        }
      } catch (err) {
        alert("AI refresh failed—check API key.");
        renderOptionsList();
      } finally {
        setLed(false);
        btn.textContent = "✨ AI";
        btn.disabled = false;
      }
    }

    if (activeTask) {
      renderActiveTask();
      showStep("step-active-task");
    } else {
      renderCategoryGrid();
      showStep("step-categories");
    }
  </script>
</body>
</html>
